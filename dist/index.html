<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle & Customer Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex flex-wrap items-center justify-between gap-4 bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg">
      <div>
        <h1 class="text-xl md:text-2xl font-bold text-white flex items-center gap-2">
          <span>🚗</span> Vehicle & Customer Manager
        </h1>
        <p class="text-xs text-slate-400 mt-1">Live Persistent Storage • Cloudflare Pages Ready</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="location.reload()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-semibold">
          🔄 Refresh Page (Test Delete)
        </button>
        <button onclick="resetDefaults()" class="px-3 py-2 bg-slate-950 hover:bg-slate-800 text-slate-400 border border-slate-800 rounded-xl text-xs">
          Reset Data
        </button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="flex gap-2">
      <button id="tabVehiclesBtn" onclick="switchTab('vehicles')" class="px-4 py-2 bg-orange-500 text-white rounded-xl text-xs font-bold shadow-md">
        Vehicles (<span id="vehCount">0</span>)
      </button>
      <button id="tabCustomersBtn" onclick="switchTab('customers')" class="px-4 py-2 bg-slate-900 text-slate-400 border border-slate-800 rounded-xl text-xs font-bold hover:text-white">
        Customers (<span id="custCount">0</span>)
      </button>
    </div>

    <!-- Vehicles Section -->
    <div id="vehiclesSection" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-800">
        <h2 class="text-base font-bold text-white">Vehicles Inventory</h2>
        <button onclick="openAddVehicleModal()" class="px-3.5 py-1.5 bg-orange-600 hover:bg-orange-500 text-white text-xs font-semibold rounded-xl">
          + Add Vehicle
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="text-slate-500 border-b border-slate-800 uppercase text-[10px]">
            <tr>
              <th class="py-2.5 px-3">Vehicle</th>
              <th class="py-2.5 px-3">License Plate</th>
              <th class="py-2.5 px-3">Year / Color</th>
              <th class="py-2.5 px-3">Owner</th>
              <th class="py-2.5 px-3 text-right">Action</th>
            </tr>
          </thead>
          <tbody id="vehiclesTableBody" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </div>

    <!-- Customers Section -->
    <div id="customersSection" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 hidden">
      <div class="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-800">
        <h2 class="text-base font-bold text-white">Customers Directory</h2>
        <button onclick="openAddCustomerModal()" class="px-3.5 py-1.5 bg-orange-600 hover:bg-orange-500 text-white text-xs font-semibold rounded-xl">
          + Add Customer
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="text-slate-500 border-b border-slate-800 uppercase text-[10px]">
            <tr>
              <th class="py-2.5 px-3">Name</th>
              <th class="py-2.5 px-3">Email</th>
              <th class="py-2.5 px-3">Phone</th>
              <th class="py-2.5 px-3 text-right">Action</th>
            </tr>
          </thead>
          <tbody id="customersTableBody" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const INITIAL_VEHICLES = [
      { id: "1", make: "Toyota", model: "Corolla", year: 2023, plate: "7ABC123", color: "White", owner: "Robert Davis" },
      { id: "2", make: "Tesla", model: "Model 3", year: 2022, plate: "8XYZ889", color: "Blue", owner: "Sophia Martinez" },
      { id: "3", make: "Ford", model: "F-150", year: 2021, plate: "9KJH456", color: "Black", owner: "Michael Chen" }
    ];

    const INITIAL_CUSTOMERS = [
      { id: "c1", name: "Robert Davis", email: "robert@example.com", phone: "+1 555-234-5678" },
      { id: "c2", name: "Sophia Martinez", email: "sophia@example.com", phone: "+1 555-876-5432" },
      { id: "c3", name: "Michael Chen", email: "mchen@example.com", phone: "+1 555-432-1098" }
    ];

    // 1. Persistent Storage Loader (Preserves empty array after deletions)
    function getStored(key, defaults) {
      const saved = localStorage.getItem(key);
      if (saved !== null) {
        try { return JSON.parse(saved); } catch (e) { console.error(e); }
      }
      localStorage.setItem(key, JSON.stringify(defaults));
      return defaults;
    }

    let vehicles = getStored("app_vehicles_db", INITIAL_VEHICLES);
    let customers = getStored("app_customers_db", INITIAL_CUSTOMERS);

    // 2. Render Functions
    function render() {
      document.getElementById("vehCount").textContent = vehicles.length;
      document.getElementById("custCount").textContent = customers.length;

      const vBody = document.getElementById("vehiclesTableBody");
      if (vehicles.length === 0) {
        vBody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-slate-500">All vehicles deleted. Click "Reset Data" to restore.</td></tr>';
      } else {
        vBody.innerHTML = vehicles.map(v => `
          <tr class="hover:bg-slate-800/40">
            <td class="py-3 px-3 font-semibold text-white">${v.year} ${v.make} ${v.model}</td>
            <td class="py-3 px-3 font-mono text-orange-400">${v.plate}</td>
            <td class="py-3 px-3 text-slate-400">${v.color}</td>
            <td class="py-3 px-3 text-slate-300">${v.owner || 'Unassigned'}</td>
            <td class="py-3 px-3 text-right">
              <button onclick="deleteVehicle('${v.id}')" class="px-2.5 py-1 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg text-xs font-semibold">
                Delete
              </button>
            </td>
          </tr>
        `).join("");
      }

      const cBody = document.getElementById("customersTableBody");
      if (customers.length === 0) {
        cBody.innerHTML = '<tr><td colspan="4" class="py-8 text-center text-slate-500">All customers deleted.</td></tr>';
      } else {
        cBody.innerHTML = customers.map(c => `
          <tr class="hover:bg-slate-800/40">
            <td class="py-3 px-3 font-semibold text-white">${c.name}</td>
            <td class="py-3 px-3 text-slate-400">${c.email}</td>
            <td class="py-3 px-3 text-slate-400">${c.phone}</td>
            <td class="py-3 px-3 text-right">
              <button onclick="deleteCustomer('${c.id}')" class="px-2.5 py-1 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg text-xs font-semibold">
                Delete
              </button>
            </td>
          </tr>
        `).join("");
      }
    }

    // 3. PERSISTENT DELETE FUNCTIONS (Saves to localStorage instantly)
    function deleteVehicle(id) {
      vehicles = vehicles.filter(v => v.id !== id);
      localStorage.setItem("app_vehicles_db", JSON.stringify(vehicles));
      render();
    }

    function deleteCustomer(id) {
      customers = customers.filter(c => c.id !== id);
      localStorage.setItem("app_customers_db", JSON.stringify(customers));
      render();
    }

    function switchTab(tab) {
      if (tab === 'vehicles') {
        document.getElementById("vehiclesSection").classList.remove("hidden");
        document.getElementById("customersSection").classList.add("hidden");
        document.getElementById("tabVehiclesBtn").className = "px-4 py-2 bg-orange-500 text-white rounded-xl text-xs font-bold shadow-md";
        document.getElementById("tabCustomersBtn").className = "px-4 py-2 bg-slate-900 text-slate-400 border border-slate-800 rounded-xl text-xs font-bold hover:text-white";
      } else {
        document.getElementById("vehiclesSection").classList.add("hidden");
        document.getElementById("customersSection").classList.remove("hidden");
        document.getElementById("tabVehiclesBtn").className = "px-4 py-2 bg-slate-900 text-slate-400 border border-slate-800 rounded-xl text-xs font-bold hover:text-white";
        document.getElementById("tabCustomersBtn").className = "px-4 py-2 bg-orange-500 text-white rounded-xl text-xs font-bold shadow-md";
      }
    }

    function resetDefaults() {
      if (confirm("Reset to sample data?")) {
        localStorage.setItem("app_vehicles_db", JSON.stringify(INITIAL_VEHICLES));
        localStorage.setItem("app_customers_db", JSON.stringify(INITIAL_CUSTOMERS));
        vehicles = [...INITIAL_VEHICLES];
        customers = [...INITIAL_CUSTOMERS];
        render();
      }
    }

    function openAddVehicleModal() {
      const make = prompt("Enter Make (e.g. Honda):");
      if (!make) return;
      const model = prompt("Enter Model (e.g. Civic):");
      if (!model) return;
      const plate = prompt("Enter License Plate:");
      if (!plate) return;
      vehicles.unshift({
        id: Date.now().toString(),
        make,
        model,
        year: 2024,
        plate: plate.toUpperCase(),
        color: "Silver",
        owner: "Assigned"
      });
      localStorage.setItem("app_vehicles_db", JSON.stringify(vehicles));
      render();
    }

    function openAddCustomerModal() {
      const name = prompt("Enter Customer Name:");
      if (!name) return;
      const email = prompt("Enter Customer Email:");
      if (!email) return;
      customers.unshift({
        id: Date.now().toString(),
        name,
        email,
        phone: "+1 555-000-0000"
      });
      localStorage.setItem("app_customers_db", JSON.stringify(customers));
      render();
    }

    // Initial render
    render();
  </script>
</body>
</html>
